[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docqa-assistant"
version = "0.1.0"
description = "Personal & technical document Q&A assistant with hybrid retrieval (BM25 + Vector RRF) and source citations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
docqa = "docqa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
