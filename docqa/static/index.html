<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocQA Assistant — 개인/기술 문서 Q&A</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.25rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.5rem; }
    .badge { font-size: 0.8rem; padding: 0.25rem 0.6rem; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); color: var(--accent); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1; min-width: 220px; padding: 0.7rem 0.9rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.95rem;
    }
    button {
      padding: 0.7rem 1.15rem; border-radius: 8px; border: none;
      background: var(--accent); color: #0f172a; font-weight: 600; cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .answer { white-space: pre-wrap; margin-top: 1rem; }
    .citation {
      margin-top: 0.75rem; padding: 0.75rem; border-radius: 8px;
      background: var(--bg); border: 1px solid var(--border); font-size: 0.88rem;
    }
    .citation strong { color: var(--accent); }
    .muted { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>DocQA Assistant</h1>
        <div class="muted">개인·기술 문서 기반 하이브리드 RAG Q&A 어시스턴트</div>
      </div>
      <span id="statusBadge" class="badge">로딩 중...</span>
    </header>

    <div class="card">
      <div class="row">
        <input id="docsDirInput" type="text" placeholder="인덱싱할 문서 폴더 경로 (비워두면 기본값 ./sample_docs)" />
        <button class="secondary" onclick="reindex()">문서 인덱싱</button>
      </div>
      <div id="docsList" class="muted" style="margin-top: 0.75rem;"></div>
    </div>

    <div class="card">
      <div class="row">
        <input id="questionInput" type="text" placeholder="문서에 대해 질문해 보세요 (예: 배포 절차는 어떻게 되나요?)" />
        <button onclick="ask()">질문하기</button>
      </div>
      <div id="answerBox" class="answer"></div>
      <div id="citationsBox"></div>
    </div>
  </div>

  <script>
    async function refreshStatus() {
      const [hRes, dRes] = await Promise.all([fetch('/api/health'), fetch('/api/docs')]);
      const health = await hRes.json();
      const docs = await dRes.json();
      document.getElementById('statusBadge').textContent =
        `Provider: ${health.provider} · Chunks: ${health.indexed_chunks}`;
      const names = docs.documents.map(d => `${d.source} (${d.chunks})`).join(', ');
      document.getElementById('docsList').textContent =
        names ? `인덱싱된 문서: ${names}` : '인덱싱된 문서가 없습니다.';
    }

    async function reindex() {
      const docsDir = document.getElementById('docsDirInput').value.trim() || null;
      const res = await fetch('/api/index', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ docs_dir: docsDir })
      });
      const data = await res.json();
      if (!res.ok) { alert(data.detail || '인덱싱 실패'); return; }
      await refreshStatus();
      alert(`${data.documents}개 문서(${data.chunks}개 청크) 인덱싱 완료!`);
    }

    async function ask() {
      const q = document.getElementById('questionInput').value.trim();
      if (!q) return;
      document.getElementById('answerBox').textContent = '답변 생성 중...';
      document.getElementById('citationsBox').innerHTML = '';
      const res = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      document.getElementById('answerBox').textContent = data.answer;
      const box = document.getElementById('citationsBox');
      data.citations.forEach(c => {
        const div = document.createElement('div');
        div.className = 'citation';
        div.innerHTML = `<strong>[${c.index}] ${c.source} › ${c.section}</strong> (score: ${c.score})<div class="muted">${c.excerpt}</div>`;
        box.appendChild(div);
      });
    }

    document.getElementById('questionInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') ask();
    });
    refreshStatus();
  </script>
</body>
</html>
